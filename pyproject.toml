[project]
name = "chatwithpdf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JanaAshraf975", email = "ganaashraf79@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.38.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
]

[project.scripts]
chatwithpdf = "chatwithpdf:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
